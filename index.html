<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IF U SKILL – Tarjeta de Candidato</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;500;600&display=swap');

  :root {
    --green: #84FF00;
    --black: #0a0a0a;
    --dark: #111111;
    --gray: #1e1e1e;
    --lightgray: #2a2a2a;
    --white: #ffffff;
    --muted: #888888;
    --border: #333333;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Barlow', sans-serif;
    background: #141414;
    color: var(--white);
    min-height: 100vh;
  }

  /* ─── EDITOR TOOLBAR ─── */
  #editor-bar {
    background: var(--black);
    border-bottom: 2px solid var(--green);
    padding: 10px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .brand-bar {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 1.2rem;
    letter-spacing: 1px;
    color: var(--white);
    margin-right: auto;
  }
  .brand-bar span { color: var(--green); }

  .badge-edit {
    background: var(--green);
    color: var(--black);
    font-size: 0.7rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 20px;
    letter-spacing: 1px;
  }

  .btn {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    letter-spacing: 1px;
    padding: 8px 18px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-outline {
    background: transparent;
    border: 1.5px solid var(--border);
    color: var(--white);
  }
  .btn-outline:hover { border-color: var(--green); color: var(--green); }
  .btn-green {
    background: var(--green);
    color: var(--black);
  }
  .btn-green:hover { background: #9fff1a; transform: translateY(-1px); }
  .btn-red {
    background: transparent;
    border: 1.5px solid #ff4444;
    color: #ff4444;
    font-size: 0.75rem;
    padding: 5px 10px;
  }
  .btn-red:hover { background: #ff4444; color: white; }

  /* ─── CARD WRAPPER ─── */
  #card-wrapper {
    max-width: 960px;
    margin: 30px auto;
    padding: 0 16px 60px;
  }

  #card {
    background: #f5f5f5;
    color: var(--black);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    display: grid;
    grid-template-columns: 240px 1fr;
    min-height: 600px;
  }
